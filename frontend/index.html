<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <!-- Development version -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Production version -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Todo List</title>
  </head>
  <body>
    <header class="flex place-content-between p-6 border-b-1 border-gray-200">
      <h1 class="font-bold text-xl">Dashboard Gestion De Tareas</h1>
      <button id="btn-moon" class="cursor-pointer">
        <i data-lucide="moon"></i>
      </button>
    </header>
    <div class="h-screen w-full flex flex-col items-center py-4">
      <div class="w-[60%]">
        <form
          id="form"
          class="border border-gray-200 rounded-lg shadow-lg w-full p-4 grid grid-cols-1 gap-4"
        >
          <div class="flex gap-2">
            <i data-lucide="badge-plus"></i>
            <h2 class="font-semibold">Agregar nueva tarea</h2>
          </div>
          <div class="flex flex-col">
            <label class="capitalize font-semibold" for="">titulo</label>
            <input
              type="text"
              name="title"
              placeholder="ingrese el titulo"
              class="h-10 pl-4 border-2 border-slate-900"
            />
          </div>
          <div class="flex flex-col">
            <label class="capitalize font-semibold" for="">descripcion</label>
            <input
              type="text"
              name="description"
              placeholder="ingrese la descripcion"
              class="h-10 pl-4 border-2 border-slate-900"
            />
          </div>
          <button
            class="h-10 bg-blue-500 text-white uppercase hover:bg-blue-800 transition-colors cursor-pointer"
          >
            Agregar
          </button>
        </form>
      </div>
      <div class="w-[90%]">
        <section class="flex-1 p-4 w-full">
          <div class="flex gap-2 py-4">
            <i data-lucide="list"></i>
            <h2 class="font-semibold">Lista de tareas</h2>
          </div>
          <table class="w-full rounded-md overflow-hidden">
            <thead class="bg-gray-200">
              <tr class="text-left uppercase h-14">
                <th class="pl-4">check</th>
                <th class="pl-4">id</th>
                <th class="pl-4">titulo</th>
                <th class="pl-4">descripcion</th>
                <th class="pl-4">actions</th>
              </tr>
            </thead>

            <tbody id="coders-tbody"></tbody>
          </table>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
